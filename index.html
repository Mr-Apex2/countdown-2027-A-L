<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027 A/L Exam Countdown</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030712;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.12) 0%, transparent 60%),
                linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: #ffffff;
            font-family: 'Orbitron', 'Noto Sans Sinhala', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            max-width: 950px;
            width: 100%;
            padding: 45px 25px;
            border-radius: 20px;
            background: rgba(6, 15, 35, 0.75);
            backdrop-filter: blur(12px);
            border: 2px solid #00f3ff;
            box-shadow: 
                0 0 25px rgba(0, 243, 255, 0.4),
                inset 0 0 20px rgba(0, 243, 255, 0.2);
            animation: borderPulse 4s infinite alternate;
        }

        @keyframes borderPulse {
            0% {
                box-shadow: 0 0 20px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
            }
            100% {
                box-shadow: 0 0 40px rgba(0, 243, 255, 0.8), inset 0 0 25px rgba(0, 243, 255, 0.35);
            }
        }

        .badge {
            display: inline-block;
            padding: 6px 18px;
            margin-bottom: 18px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #00f3ff;
            border: 1px solid #00f3ff;
            border-radius: 50px;
            background: rgba(0, 243, 255, 0.1);
            text-shadow: 0 0 8px #00f3ff;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 
                0 0 10px #00f3ff,
                0 0 25px #0088ff,
                0 0 45px #0055ff;
            margin-bottom: 10px;
        }

        .subtitle {
            font-family: 'Noto Sans Sinhala', sans-serif;
            font-size: 1.15rem;
            color: #93c5fd;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .time-box {
            background: rgba(2, 10, 25, 0.9);
            border: 1.5px solid rgba(0, 243, 255, 0.6);
            border-radius: 15px;
            padding: 25px 15px;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
        }

        .time-box:hover {
            transform: translateY(-6px);
            border-color: #00f3ff;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.6);
        }

        .number {
            display: block;
            font-size: 3.4rem;
            font-weight: 700;
            color: #00f3ff;
            text-shadow: 
                0 0 12px rgba(0, 243, 255, 0.8),
                0 0 25px rgba(0, 140, 255, 0.6);
            line-height: 1.1;
        }

        .label {
            display: block;
            margin-top: 12px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #cbd5e1;
            text-transform: uppercase;
        }

        .sinhala-label {
            font-family: 'Noto Sans Sinhala', sans-serif;
            font-size: 0.85rem;
            color: #38bdf8;
            margin-top: 4px;
            display: block;
        }

        .target-date-box {
            padding: 15px;
            border-top: 1px solid rgba(0, 243, 255, 0.25);
            font-family: 'Noto Sans Sinhala', sans-serif;
            color: #e2e8f0;
            font-size: 1rem;
        }

        .target-date-box span {
            color: #00f3ff;
            font-weight: 700;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
        }

        .quote {
            margin-top: 20px;
            font-family: 'Noto Sans Sinhala', sans-serif;
            font-size: 0.95rem;
            color: #60a5fa;
            font-style: italic;
        }

        /* Responsive Design for Mobile */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
            .countdown-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            .number {
                font-size: 2.6rem;
            }
        }

        @media (max-width: 400px) {
            .number {
                font-size: 2.1rem;
            }
            .container {
                padding: 30px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">G.C.E. ADVANCED LEVEL • SRI LANKA</div>
        <h1>2027 A/L EXAM COUNTDOWN</h1>
        <p class="subtitle">2027 අ.පො.ස. උසස් පෙළ විභාගයට තව ඉතිරිව ඇති කාලය</p>

        <div class="countdown-grid" id="countdown">
            <div class="time-box">
                <span class="number" id="days">000</span>
                <span class="label">Days</span>
                <span class="sinhala-label">දින</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Hours</span>
                <span class="sinhala-label">පැය</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Minutes</span>
                <span class="sinhala-label">මිනිත්තු</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Seconds</span>
                <span class="sinhala-label">තත්පර</span>
            </div>
        </div>

        <div class="target-date-box">
            විභාගය ආරම්භ වන දිනය: <span>2027 අගෝස්තු 03 (පෙ.ව. 8:30)</span>
        </div>
        <div class="quote">"සිහින දකින්න පමණක් නොව, ඒ වෙනුවෙන් අදම වැඩ කරන්න!"</div>
    </div>

    <script>
        // 2027 අගෝස්තු 3 උදෑසන 8:30 (Sri Lanka Standard Time +05:30)
        const examDate = new Date("2027-08-03T08:30:00+05:30").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = examDate - now;

            if (distance < 0) {
                document.getElementById("countdown").innerHTML = 
                    "<h2 style='grid-column: 1 / -1; color: #00f3ff; text-shadow: 0 0 15px #00f3ff;'>විභාගය ආරම්භ වී ඇත! ඔබට ජය!</h2>";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days.toString().padStart(3, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
        }

        // තත්පරයක් පාසා යාවත්කාලීන කිරීම
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>


</body>
</html>
